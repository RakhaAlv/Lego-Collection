<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LEGO COLLECTION: Explore Marvel, Disney, Harry Potter, NINJAGO, LEGO City, and Star Wars collections.">

  <!-- Open Graph & Twitter Preview Cards -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LEGO COLLECTION">
  <meta property="og:description" content="Explore, compare, and save iconic LEGO sets in a clean editorial catalog.">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/500px-LEGO_logo.svg.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LEGO COLLECTION">
  <meta name="twitter:description" content="Explore, compare, and save iconic LEGO sets in a clean editorial catalog.">
  <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/500px-LEGO_logo.svg.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LEGO COLLECTION">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LEGO COLLECTION</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #1E1E1E;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    .boot-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 18px;
    }
    .boot-label {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      color: #1E1E1E;
      margin-bottom: 14px;
    }
    .boot-bar {
      width: 140px;
      height: 2px;
      background: #EBEBEB;
      overflow: hidden;
      position: relative;
    }
    .boot-bar::after {
      content: "";
      position: absolute;
      left: -45%;
      width: 45%;
      height: 100%;
      background: #D01012;
      animation: slide 1.1s infinite ease-in-out;
    }
    @keyframes slide {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="boot-loader">
    <img
      class="boot-logo"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/500px-LEGO_logo.svg.png"
      alt="LEGO"
    />
    <div class="boot-label">LEGO COLLECTION</div>
    <div class="boot-bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
